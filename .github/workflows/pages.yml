name: Build and deploy Web game

on:
  push:
    branches:
      - main
      - arena/04a18e75-rally
      - arena/351d2d6e-rally
      - arena/a46c3d2b-rally
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Godot resources for merge markers
        run: python3 -m unittest discover -s tests -p test_resource_integrity.py
      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${version}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${version}.stable"
          unzip -q /tmp/templates.zip 'templates/web_*' 'templates/version.txt' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${version}.stable/"
      - name: Import project and export Web build
        shell: bash
        run: |
          set -euo pipefail
          godot="Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p export/web
          report_failure() {
            echo '::error::Godot import or export failed; see the following diagnostic annotations and the full job log.'
            echo "::error::GODOT_LOG_BASE64:$(tail -c 2000 /tmp/godot-build.log | base64 -w 0)"
          }
          trap report_failure ERR
          "$godot" --headless --editor --path . --import 2>&1 | tee /tmp/godot-build.log
          "$godot" --headless --path . --script res://tests/scenery_resource_smoke.gd 2>&1 | tee -a /tmp/godot-build.log
          "$godot" --headless --path . --export-release Web export/web/index.html 2>&1 | tee -a /tmp/godot-build.log
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web
  # Проверки машин и звука в настоящем движке: их нельзя прогнать без Godot,
  # а ошибки в .tres/.tscn (uid, группы, поля ресурса) видны только там.
  # Две задачи: быстрая — реестр и данные, медленная — физика и заезды. У каждой
  # проверки свой `timeout`, чтобы подвисший тест не утонул в общем лимите задачи,
  # а назвал себя в аннотации. Публикацию Pages не блокируют: deploy зависит
  # только от build.
  vehicle-tests-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (4.7.2 headless)
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${version}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Реестр, пресеты и звук машин
        shell: bash
        run: |
          set -uo pipefail
          godot="Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --headless --editor --path . --import >/tmp/import.log 2>&1 || {
            echo '::error::Импорт проекта упал — лог ниже'
            tail -n 60 /tmp/import.log
          }
          failed=0
          started_at=0
          sum() {
            printf "%s\n" "$@" >> "$GITHUB_STEP_SUMMARY"
          }
          note() {
            echo "::notice::$1"
          }
          sum '### Проверки машин' '' '| проверка | итог | секунды |'
          sum '| --- | --- | --- |'
          run_py() {
            echo "::group::$1"
            echo "=== $1 ($(date -u +%H:%M:%S)) ==="
            started_at=$SECONDS
            log="/tmp/$(echo "$1" | tr "/." "__").log"
            if timeout --kill-after=20s 300s python3 -m unittest "$1" >"$log" 2>&1; then
              note "$1: OK за $((SECONDS - started_at)) с"
              sum "| $1 | ✅ | $((SECONDS - started_at)) |"
            else
              code=$?
              echo "::error::python-проверка $1 провалилась (код $code)"
              sum "| $1 | ❌ код $code | $((SECONDS - started_at)) |"
              failed=$((failed + 1))
            fi
            tail -n 40 "$log"
            echo "::endgroup::"
          }
          run_gd() {
            local limit="$1"; shift
            echo "::group::$1"
            echo "=== $1 ($(date -u +%H:%M:%S)) ==="
            started_at=$SECONDS
            log="/tmp/$(echo "$1" | tr "/." "__").log"
            if timeout --kill-after=30s "$limit" "$godot" --headless --path . \
                --fixed-fps 120 --script "res://$1" >"$log" 2>&1; then
              note "$1: OK за $((SECONDS - started_at)) с"
              sum "| $1 | ✅ | $((SECONDS - started_at)) |"
            else
              code=$?
              if [ "$code" = 124 ] || [ "$code" = 137 ]; then
                echo "::error::проверка $1 не завершилась за $limit — подвисла"
                sum "| $1 | ⏳ подвисла ($limit) | $((SECONDS - started_at)) |"
              else
                echo "::error::проверка $1 провалилась (код $code)"
                sum "| $1 | ❌ код $code | $((SECONDS - started_at)) |"
              fi
              failed=$((failed + 1))
              echo "::error::LOG_BASE64 $1: $(tail -c 2400 "$log" | base64 -w 0)"
            fi
            echo "--- сводка $1 ---"
            grep -aE "FAIL:|PASS:|^OK|SCRIPT ERROR|^ERROR:" "$log" | head -n 25 || true
            tail -n 60 "$log"
            echo "::endgroup::"
          }
          run_py tests.test_vehicle_roster
          run_gd 180s tests/golf_presets.gd
          run_gd 180s tests/subaru_presets.gd
          run_gd 180s tests/car_liveries.gd
          run_gd 180s tests/car_body_fx.gd
          run_gd 600s tests/engine_audio.gd
          sum "" "_Провалено проверок: ${failed}_"
          echo "Провалено проверок: $failed"
          exit "$failed"

  vehicle-tests-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot (4.7.2 headless)
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${version}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Физика кузова, колёса и заезды
        shell: bash
        run: |
          set -uo pipefail
          godot="Godot_v4.7.2-stable_linux.x86_64"
          "$godot" --headless --editor --path . --import >/tmp/import.log 2>&1 || {
            echo '::error::Импорт проекта упал — лог ниже'
            tail -n 60 /tmp/import.log
          }
          failed=0
          started_at=0
          sum() {
            printf "%s\n" "$@" >> "$GITHUB_STEP_SUMMARY"
          }
          note() {
            echo "::notice::$1"
          }
          sum '### Проверки машин' '' '| проверка | итог | секунды |'
          sum '| --- | --- | --- |'
          run_py() {
            echo "::group::$1"
            echo "=== $1 ($(date -u +%H:%M:%S)) ==="
            started_at=$SECONDS
            log="/tmp/$(echo "$1" | tr "/." "__").log"
            if timeout --kill-after=20s 300s python3 -m unittest "$1" >"$log" 2>&1; then
              note "$1: OK за $((SECONDS - started_at)) с"
              sum "| $1 | ✅ | $((SECONDS - started_at)) |"
            else
              code=$?
              echo "::error::python-проверка $1 провалилась (код $code)"
              sum "| $1 | ❌ код $code | $((SECONDS - started_at)) |"
              failed=$((failed + 1))
            fi
            tail -n 40 "$log"
            echo "::endgroup::"
          }
          run_gd() {
            local limit="$1"; shift
            echo "::group::$1"
            echo "=== $1 ($(date -u +%H:%M:%S)) ==="
            started_at=$SECONDS
            log="/tmp/$(echo "$1" | tr "/." "__").log"
            if timeout --kill-after=30s "$limit" "$godot" --headless --path . \
                --fixed-fps 120 --script "res://$1" >"$log" 2>&1; then
              note "$1: OK за $((SECONDS - started_at)) с"
              sum "| $1 | ✅ | $((SECONDS - started_at)) |"
            else
              code=$?
              if [ "$code" = 124 ] || [ "$code" = 137 ]; then
                echo "::error::проверка $1 не завершилась за $limit — подвисла"
                sum "| $1 | ⏳ подвисла ($limit) | $((SECONDS - started_at)) |"
              else
                echo "::error::проверка $1 провалилась (код $code)"
                sum "| $1 | ❌ код $code | $((SECONDS - started_at)) |"
              fi
              failed=$((failed + 1))
              echo "::error::LOG_BASE64 $1: $(tail -c 2400 "$log" | base64 -w 0)"
            fi
            echo "--- сводка $1 ---"
            grep -aE "FAIL:|PASS:|^OK|SCRIPT ERROR|^ERROR:" "$log" | head -n 25 || true
            tail -n 60 "$log"
            echo "::endgroup::"
          }
          run_gd 300s tests/ghost_racer.gd
          run_gd 900s tests/car_obstacle_collision.gd
          run_gd 900s tests/subaru_drive.gd
          run_gd 1200s tests/top_speed.gd
          sum "" "_Провалено проверок: ${failed}_"
          echo "Провалено проверок: $failed"
          exit "$failed"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
