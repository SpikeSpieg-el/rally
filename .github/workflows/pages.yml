name: Build and deploy Web game

on:
  push:
    branches:
      - main
      - arena/04a18e75-rally
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web export templates
        shell: bash
        run: |
          set -euo pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v${version}-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_export_templates.tpz" -o /tmp/templates.zip
          mkdir -p "$HOME/.local/share/godot/export_templates/${version}.stable"
          unzip -q /tmp/templates.zip 'templates/web_*' 'templates/version.txt' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${version}.stable/"
      - name: Import project and export Web build
        shell: bash
        run: |
          set -euo pipefail
          godot="Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p export/web
          "$godot" --headless --editor --path . --import
          "$godot" --headless --path . --export-release Web export/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
