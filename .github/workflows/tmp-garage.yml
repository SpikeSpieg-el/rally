name: tmp garage check
on:
  push:
    branches:
      - arena/cbe262c1-rally
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        shell: bash
        run: |
          set +e +o pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          godot=/tmp/godot/Godot_v${version}-stable_linux.x86_64
          chmod +x $godot
          $godot --headless --editor --path . --import >/tmp/import.log 2>&1
          emit() {
            local name="$1" file="$2" i=0
            gzip -9c "$file" | base64 -w 0 | fold -w 3500 | while read -r chunk || [ -n "$chunk" ]; do
              echo "::notice title=${name}-${i}::${chunk}"; i=$((i+1)); done
          }
          for t in; do
            timeout 150 $godot --headless --path . --script res://tests/$t.gd >/tmp/$t.log 2>&1
            echo "rc=$?" >> /tmp/$t.log
            grep -aE "FAIL|SCRIPT ERROR|callouts\]|rc=|итого|OK" /tmp/$t.log | awk '!seen[$0]++' | head -40 > /tmp/${t}_s.log
          done
          cat /tmp/*_s.log > /tmp/all.log
          emit tests /tmp/all.log
          mkdir -p /tmp/shots; touch /tmp/shots/x
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null 2>&1
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 400 $godot --path . --rendering-driver opengl3 --resolution 1920x1080 --script res://tests/tmp/garage_bisect.gd >/tmp/b.log 2>&1
          echo "rc=$?" >> /tmp/b.log
          grep -aE "bisect|SCRIPT ERROR|rc=" /tmp/b.log | head -80 > /tmp/bs.log
          emit bisect /tmp/bs.log
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shots
