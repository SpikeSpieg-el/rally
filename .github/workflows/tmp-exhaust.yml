name: tmp exhaust flame check
on:
  push:
    branches:
      - arena/fb2efc5b-rally
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        shell: bash
        run: |
          set +e +o pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          godot=/tmp/godot/Godot_v${version}-stable_linux.x86_64
          chmod +x $godot
          $godot --headless --editor --path . --import >/tmp/import.log 2>&1
          { wc -l /tmp/import.log; grep -aE "ERROR|exhaust" /tmp/import.log | head -40; tail -5 /tmp/import.log; } > /tmp/import_err.log
          emit() {
            local name="$1" file="$2" i=0
            gzip -9c "$file" | base64 -w 0 | fold -w 3500 | while read -r chunk || [ -n "$chunk" ]; do
              echo "::notice title=${name}-${i}::${chunk}"; i=$((i+1)); done
          }
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null 2>&1
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 300 $godot --path . --rendering-driver opengl3 --script res://tests/tmp/flame_shot.gd >/tmp/shot.log 2>&1
          echo "rc=$?" >> /tmp/shot.log
          tail -30 /tmp/shot.log > /tmp/shot_s.log
          emit shotlog /tmp/shot_s.log
          for t in exhaust_flame; do
            timeout 600 $godot --headless --path . --fixed-fps 120 --script res://tests/$t.gd >/tmp/$t.log 2>&1
            echo "rc=$?" >> /tmp/$t.log
            grep -aE "FAIL|PASS|OK|SCRIPT ERROR|ERROR|exhaust|rc=|итого|at:" /tmp/$t.log | head -150 > /tmp/${t}_s.log
            emit $t /tmp/${t}_s.log
          done
      - name: img0-0
        shell: bash
        run: |
          set +e +o pipefail
          base64 -w 0 /tmp/shot_0.jpg | fold -w 3500 > /tmp/c0.txt; echo >> /tmp/c0.txt
          n=0; while read -r c; do if [ -n "$c" ] && [ $n -ge 0 ] && [ $n -lt 10 ]; then echo "::notice title=img0-$n::$c"; fi; n=$((n+1)); done < /tmp/c0.txt
