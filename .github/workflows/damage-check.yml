name: Damage check (temporary)

on:
  push:
    branches:
      - arena/8866e5b9-rally

jobs:
  damage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri >/dev/null
      - name: Import
        run: |
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import > /tmp/import.log 2>&1 || true
          grep -aE "SCRIPT ERROR|Parse Error|ERROR|WARNING.*(car_damage|impact_fx|subdivider|deformation_lab)" /tmp/import.log | head -80 > /tmp/out_import.txt || true
      - name: Shader and render smoke (GL compatibility under xvfb)
        run: |
          cat > /tmp/render_smoke.gd <<'GD'
          extends SceneTree
          func _initialize() -> void:
          	call_deferred("_run")
          func _run() -> void:
          	var cam := Camera3D.new()
          	root.add_child(cam)
          	cam.position = Vector3(0, 1, 6)
          	cam.current = true
          	var car := (load("res://scenes/rally_car.tscn") as PackedScene).instantiate()
          	car.set("mouse_look_enabled", false)
          	root.add_child(car)
          	for i in 10:
          		await process_frame
          	var dv = car.get("damage_visual")
          	print("damage_visual: ", dv, " impact_fx: ", car.get("impact_fx"))
          	if dv != null:
          		print("panels ", dv.panel_count(), " verts ", dv.vertex_count())
          		var t0 := Time.get_ticks_usec()
          		var d: float = dv.apply_impact(Vector3(0, 0.6, 3.0), Vector3(0, 0, -1), 20.0)
          		print("impact depth ", d, " in ", (Time.get_ticks_usec() - t0) / 1000.0, " ms")
          		dv.add_scrape(Vector3(1.0, 0.6, 0.0), Vector3(-1, 0, 0), Vector3(0, 0, 10), 1.0, 0.1)
          		print("marks ", dv.mark_count(), " stats ", dv.triangle_stats())
          	var fx = car.get("impact_fx")
          	if fx != null:
          		fx.impact(Vector3(0, 0.6, 3.0), Vector3(0, 0, -1), 15.0, Vector3.ZERO)
          	var lab := (load("res://scenes/editor/deformation_lab.tscn") as PackedScene).instantiate()
          	root.add_child(lab)
          	for i in 30:
          		await process_frame
          	lab.call("punch_impact")
          	for i in 30:
          		await process_frame
          	print("lab impacts ", lab.get("damage_visual").impact_count())
          	print("RENDER SMOKE DONE")
          	quit(0)
          GD
          cp /tmp/render_smoke.gd ./render_smoke_tmp.gd
          timeout 300 xvfb-run -a /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path . --rendering-driver opengl3 --rendering-method gl_compatibility --audio-driver Dummy --script res://render_smoke_tmp.gd > /tmp/render.log 2>&1 || true
          grep -avE "^\s*$" /tmp/render.log | grep -aiE "error|shader|smoke|damage|impact|panels|marks|lab|at:" | head -150 > /tmp/out_render.txt || true
      - name: Engine test car_damage_visual
        run: |
          timeout 900 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 120 --script res://tests/car_damage_visual.gd > /tmp/dmg.log 2>&1 && rc=0 || rc=$?; echo "exit $rc" > /tmp/out_dmg.txt
          grep -avE "^\s*$" /tmp/dmg.log | tail -150 >> /tmp/out_dmg.txt || true
      - name: Engine test car_body_fx
        run: |
          timeout 300 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 120 --script res://tests/car_body_fx.gd > /tmp/fx.log 2>&1 && rc=0 || rc=$?; echo "exit $rc" > /tmp/out_fx.txt
          grep -aE "FAIL|PASS|SCRIPT ERROR|ERROR|at:" /tmp/fx.log | head -60 >> /tmp/out_fx.txt || true
      - name: Report
        if: always()
        run: |
          for f in import render dmg fx; do
            [ -f /tmp/out_$f.txt ] || continue
            b=$(gzip -9c /tmp/out_$f.txt | base64 -w 0)
            i=0
            while [ -n "$b" ] && [ $i -lt 10 ]; do
              echo "::notice title=$f-$i::${b:0:3000}"
              b=${b:3000}
              i=$((i+1))
            done
          done
