name: tmp banner check
on:
  push:
    branches:
      - arena/51e57f9a-rally
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        shell: bash
        run: |
          set +e +o pipefail
          version=4.7.2
          base="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl -fL --retry 3 "$base/Godot_v${version}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          godot=/tmp/godot/Godot_v${version}-stable_linux.x86_64
          chmod +x $godot
          $godot --headless --editor --path . --import >/tmp/import.log 2>&1
          emit() {
            local name="$1" file="$2" i=0
            gzip -9c "$file" | base64 -w 0 | fold -w 3500 | while read -r chunk || [ -n "$chunk" ]; do
              echo "::notice title=${name}-${i}::${chunk}"; i=$((i+1)); done
          }
          grep -aiE "sponsor|4XSponsor" /tmp/import.log | grep -aiE "error|fail" | head -10 > /tmp/all.log
          for t in sponsor_banner garage_callouts garage_smoke breakable_props; do
            timeout 240 $godot --headless --path . --script res://tests/$t.gd >/tmp/$t.log 2>&1
            echo "$t rc=$?" >> /tmp/$t.log
            grep -aE "FAIL|SCRIPT ERROR|Parse Error|SHADER|shader|rc=|OK" /tmp/$t.log | awk '!seen[$0]++' | head -25 >> /tmp/all.log
          done
          emit tests /tmp/all.log
          mkdir -p /tmp/shots
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null 2>&1
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 300 $godot --path . --rendering-driver opengl3 --resolution 1920x1080 --script res://tests/tmp/banner_shot.gd >/tmp/shot.log 2>&1
          grep -aE "ERROR|SCRIPT|SHADER|error" /tmp/shot.log | awk '!seen[$0]++' | head -20 > /tmp/sl.log; echo end >> /tmp/sl.log
          emit shotlog /tmp/sl.log
      - uses: actions/upload-artifact@v4
        with:
          name: shots
          path: /tmp/shots
  img0:
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shots
          path: shots
      - name: emit0
        shell: bash
        run: |
          base64 -w 0 shots/shot_0.jpg | fold -w 3500 > c.txt; echo >> c.txt
          n=0; while read -r c; do if [ -n "$c" ] && [ $n -ge 0 ] && [ $n -lt 9 ]; then echo "::notice title=img0-$n::$c"; fi; n=$((n+1)); done < c.txt
      - name: emit1
        shell: bash
        run: |
          base64 -w 0 shots/shot_0.jpg | fold -w 3500 > c.txt; echo >> c.txt
          n=0; while read -r c; do if [ -n "$c" ] && [ $n -ge 9 ] && [ $n -lt 18 ]; then echo "::notice title=img0-$n::$c"; fi; n=$((n+1)); done < c.txt
      - name: emit2
        shell: bash
        run: |
          base64 -w 0 shots/shot_0.jpg | fold -w 3500 > c.txt; echo >> c.txt
          n=0; while read -r c; do if [ -n "$c" ] && [ $n -ge 18 ] && [ $n -lt 27 ]; then echo "::notice title=img0-$n::$c"; fi; n=$((n+1)); done < c.txt
      - name: emit3
